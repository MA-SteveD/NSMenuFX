plugins {
    id 'java-library'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'de.jangassen'
version = '3.1.0-javafx22'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

javafx {
    version = '22.0.2'
    modules = ['javafx.controls', 'javafx.fxml']
}

repositories {
    mavenCentral()
}

// JFA is a sibling checkout rather than a published artefact, so this build pulls its jar in.
// Named once, and used both to locate the source and to declare the dependency below.
ext.jfaJarName = 'jfa-1.2.0-jna515.jar'
ext.jfaJar = file("${projectDir}/../jfa/build/libs/${jfaJarName}")

dependencies {
    implementation files("libs/${jfaJarName}")
    implementation 'net.java.dev.jna:jna:5.15.0'
    
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.7.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.7.0'
}

test {
    useJUnitPlatform()
}

jar {
    archiveBaseName = 'nsmenufx'
}

/*
 * Refresh the bundled JFA jar from the sibling checkout before compiling against it. Skipped when
 * that checkout is absent - the copy in libs/ is committed, so a clone of this project alone still
 * builds. Build JFA first when its source has changed; nothing here triggers a build over there.
 *
 * This build tells nobody about its own jar: common-javafx pulls nsmenufx from build/libs itself.
 */
task copyJfaJar(type: Copy) {
    onlyIf { jfaJar.exists() }
    from jfaJar
    into "${projectDir}/libs"
}

compileJava.dependsOn copyJfaJar